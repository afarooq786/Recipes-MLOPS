name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  lint:
    name: Formatting / lint checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (non-blocking)
        run: ruff check . --exit-zero
        # Non-blocking for now: the goal at this stage of the project is
        # catching real bugs (the pytest job above), not gating merges on
        # style. Flip `--exit-zero` off once the codebase has been run
        # through ruff once and a baseline config is agreed on.

  docker-build:
    name: Validate Docker images build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t recipe-api:ci .

      - name: Build Airflow image
        run: docker build -f Dockerfile.airflow -t recipe-airflow:ci .
