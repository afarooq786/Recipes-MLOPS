name: recipe-mlops-stack

services:
  # -------------------------------------------------------------------
  # PostgreSQL Database (Backing store for Airflow metadata)
  # -------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: recipe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # MLflow Tracking & Model Registry Server
  # -------------------------------------------------------------------
  mlflow:
    image: python:3.10-slim
    container_name: recipe-mlflow
    command: >
      sh -c "pip install --no-cache-dir mlflow>=3.0 &&
             mlflow server
             --host 0.0.0.0
             --port 5000
             --backend-store-uri sqlite:////mlflow/mlflow.db
             --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Airflow Database Initialization (One-shot task)
  # -------------------------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: recipe-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------------
  # Airflow Webserver (UI on port 8080)
  # -------------------------------------------------------------------
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: recipe-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      RECIPE_PROJECT_DIR: /opt/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./preprocessing:/opt/airflow/preprocessing
      - ./features:/opt/airflow/features
      - ./models:/opt/airflow/models
      - ./evaluation:/opt/airflow/evaluation
      - ./dvc.yaml:/opt/airflow/dvc.yaml
      - ./dvc.lock:/opt/airflow/dvc.lock
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------
  # Airflow Scheduler (Executes DAG tasks)
  # -------------------------------------------------------------------
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: recipe-airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      RECIPE_PROJECT_DIR: /opt/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./preprocessing:/opt/airflow/preprocessing
      - ./features:/opt/airflow/features
      - ./models:/opt/airflow/models
      - ./evaluation:/opt/airflow/evaluation
      - ./dvc.yaml:/opt/airflow/dvc.yaml
      - ./dvc.lock:/opt/airflow/dvc.lock
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------
  # FastAPI Inference Service (Inference REST API on port 8000)
  # -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: recipe-api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-recipe-recommender}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
    volumes:
      - mlflow_data:/mlflow
      - ./models:/app/models
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  postgres_data:
  mlflow_data:
