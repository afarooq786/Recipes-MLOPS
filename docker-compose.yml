name: recipe-mlops-stack

services:
  # -------------------------------------------------------------------
  # PostgreSQL Database (Backing store for Airflow metadata)
  # -------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: recipe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # MLflow Tracking & Model Registry Server
  # -------------------------------------------------------------------
  # DISABLED BY DEFAULT (profiles: disabled). On at least one team
  # member's machine, this exact command/version combo (MLflow 3.15.1,
  # containerized) bound only to 127.0.0.1 inside the container despite
  # --host 0.0.0.0, --allowed-hosts '*', and --workers 1 all being set --
  # confirmed at the kernel socket level (/proc/net/tcp), not just from
  # log messages. Root cause not identified; not a config mistake on our
  # end (identical flags/version worked fine run directly, outside Docker).
  #
  # WORKAROUND IN USE: run MLflow directly on the host machine instead --
  # it has direct access to the already-existing local mlflow.db /
  # mlartifacts/ (which this container would NOT have had access to
  # anyway, since those aren't in this container's volume) --
  #
  #   mlflow server --host 0.0.0.0 --port 5000 \
  #     --backend-store-uri sqlite:///mlflow.db \
  #     --default-artifact-root ./mlartifacts \
  #     --allowed-hosts '*' --cors-allowed-origins '*'
  #
  # api/airflow-webserver/airflow-scheduler below point at
  # http://host.docker.internal:5000 to reach it. To re-enable this
  # containerized service once the bind issue is root-caused, remove
  # the `profiles` line and switch the other services' MLFLOW_TRACKING_URI
  # back to http://mlflow:5000.
  mlflow:
    profiles: ["disabled"]
    image: python:3.10-slim
    container_name: recipe-mlflow
    command: >
      sh -c "pip install --no-cache-dir mlflow>=3.0 &&
             mlflow server
             --host 0.0.0.0
             --port 5000
             --workers 1
             --backend-store-uri sqlite:////mlflow/mlflow.db
             --default-artifact-root /mlflow/artifacts
             --allowed-hosts '*'
             --cors-allowed-origins '*'"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------------
  # Airflow Database Initialization (One-shot task)
  # -------------------------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: recipe-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------------
  # Airflow Webserver (UI on port 8080)
  # -------------------------------------------------------------------
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: recipe-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      RECIPE_PROJECT_DIR: /opt/airflow
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./preprocessing:/opt/airflow/preprocessing
      - ./features:/opt/airflow/features
      - ./models:/opt/airflow/models
      - ./evaluation:/opt/airflow/evaluation
      - ./dvc.yaml:/opt/airflow/dvc.yaml
      - ./dvc.lock:/opt/airflow/dvc.lock
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------
  # Airflow Scheduler (Executes DAG tasks)
  # -------------------------------------------------------------------
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: recipe-airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      RECIPE_PROJECT_DIR: /opt/airflow
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./preprocessing:/opt/airflow/preprocessing
      - ./features:/opt/airflow/features
      - ./models:/opt/airflow/models
      - ./evaluation:/opt/airflow/evaluation
      - ./dvc.yaml:/opt/airflow/dvc.yaml
      - ./dvc.lock:/opt/airflow/dvc.lock
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------
  # FastAPI Inference Service (Inference REST API on port 8000)
  # -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: recipe-api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
      MODEL_NAME: ${MODEL_NAME:-recipe-recommender}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
    volumes:
      - ./models:/app/models

  # -------------------------------------------------------------------
  # Streamlit Monitoring Dashboard
  # -------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: recipe-dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./monitoring:/app/monitoring
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------------
  # Streamlit Consumer Webapp (SavorAI Culinary Studio)
  # -------------------------------------------------------------------
  # Consumer-facing recipe evaluator and menu ranker. Distinct from the
  # `dashboard` service above: dashboard is the team's internal monitoring
  # view (system health, drift, verify_alerts); webapp is the product-facing
  # demo of the model itself (single-recipe scoring + batch menu ranking).
  # Calls the live api service's /predict endpoint for real inference, with
  # a local heuristic fallback (see pipeline_adapter.py) if the API is
  # unreachable, so the demo still works standalone.
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: recipe-webapp
    ports:
      - "8502:8502"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8502/_stcore/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  mlflow_data: